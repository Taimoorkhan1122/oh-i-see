<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Oh I See — evidence-backed visual regression audits</title>
  <desc id="desc">A dark visual forensics banner with a measured browser frame, focus ring, and diagnostic annotations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111321"/>
      <stop offset="0.58" stop-color="#17142b"/>
      <stop offset="1" stop-color="#081d29"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="24%" r="68%">
      <stop offset="0" stop-color="#64e8ff" stop-opacity=".34"/>
      <stop offset=".4" stop-color="#9b6cff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b7c7ff" stroke-opacity=".075"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <circle cx="1060" cy="116" r="115" fill="#8f6cff" opacity=".14" filter="url(#soft)"/>
  <circle cx="1110" cy="500" r="135" fill="#47e6ff" opacity=".1" filter="url(#soft)"/>

  <g transform="translate(84 100)">
    <text x="0" y="26" fill="#6ee7ff" font-family="monospace" font-size="18" font-weight="700" letter-spacing="4">VISUAL QA / 01</text>
    <text x="0" y="146" fill="#f5f7ff" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" letter-spacing="-5">Oh I See</text>
    <text x="5" y="196" fill="#bfc7e8" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing=".4">Evidence-backed visual regression audits.</text>
    <rect x="4" y="244" width="74" height="5" rx="2.5" fill="#6ee7ff"/>
    <rect x="88" y="244" width="34" height="5" rx="2.5" fill="#a273ff"/>
    <rect x="132" y="244" width="14" height="5" rx="2.5" fill="#f5d76e"/>
  </g>

  <g transform="translate(664 92)" filter="url(#shadow)">
    <rect width="510" height="398" rx="18" fill="#0c0f1d" stroke="#8d9acb" stroke-opacity=".5"/>
    <rect x="1" y="1" width="508" height="42" rx="17" fill="#20243a"/>
    <circle cx="25" cy="22" r="6" fill="#ff6d83"/>
    <circle cx="45" cy="22" r="6" fill="#f5d76e"/>
    <circle cx="65" cy="22" r="6" fill="#64e8ff"/>
    <rect x="102" y="14" width="282" height="16" rx="8" fill="#0f1221" stroke="#707ba6" stroke-opacity=".4"/>
    <text x="116" y="26" fill="#8993b8" font-family="monospace" font-size="9">localhost:5173 / signup / invalid</text>

    <rect x="34" y="78" width="442" height="278" rx="10" fill="#14182a"/>
    <rect x="58" y="104" width="164" height="12" rx="6" fill="#e8ebff"/>
    <rect x="58" y="126" width="218" height="8" rx="4" fill="#6f789c"/>
    <rect x="58" y="170" width="394" height="43" rx="7" fill="#0b0e1a" stroke="#303855"/>
    <rect x="58" y="234" width="394" height="43" rx="7" fill="#0b0e1a" stroke="#6ee7ff" stroke-width="2"/>
    <rect x="74" y="247" width="150" height="17" rx="4" fill="#2a3150"/>
    <rect x="58" y="298" width="148" height="35" rx="17" fill="#8f6cff"/>
    <text x="95" y="321" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Continue</text>

    <path d="M450 218 L420 276 L444 269 L457 296 L469 290 L456 263 L480 257 Z" fill="#fff" stroke="#111321" stroke-width="4"/>
    <rect x="300" y="164" width="156" height="34" rx="6" fill="#101525" stroke="#6ee7ff" stroke-opacity=".8"/>
    <text x="312" y="185" fill="#6ee7ff" font-family="monospace" font-size="10">focus: 2.0px ring</text>
  </g>

  <g transform="translate(700 536)">
    <circle cx="0" cy="0" r="5" fill="#6ee7ff"/>
    <text x="17" y="5" fill="#9da8d1" font-family="monospace" font-size="13">SCREENSHOT  •  MEASURE  •  VERIFY</text>
  </g>

  <text x="1194" y="606" text-anchor="end" fill="#7f8ab1" font-family="monospace" font-size="12" letter-spacing="2">OH-I-SEE / 2026</text>
</svg>
