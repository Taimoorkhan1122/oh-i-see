<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Oh I See — evidence-backed visual regression audits</title>
  <desc id="desc">A dark visual forensics banner with a browser window comparing desktop, tablet, and mobile responsive viewports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111321"/>
      <stop offset="0.58" stop-color="#17142b"/>
      <stop offset="1" stop-color="#081d29"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="24%" r="68%">
      <stop offset="0" stop-color="#64e8ff" stop-opacity=".34"/>
      <stop offset=".4" stop-color="#9b6cff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b7c7ff" stroke-opacity=".075"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <circle cx="1060" cy="116" r="115" fill="#8f6cff" opacity=".14" filter="url(#soft)"/>
  <circle cx="1110" cy="500" r="135" fill="#47e6ff" opacity=".1" filter="url(#soft)"/>

  <g transform="translate(84 100)">
    <text x="0" y="26" fill="#6ee7ff" font-family="monospace" font-size="18" font-weight="700" letter-spacing="4">VISUAL QA / 01</text>
    <text x="0" y="146" fill="#f5f7ff" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" letter-spacing="-5">Oh I See</text>
    <text x="5" y="196" fill="#bfc7e8" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing=".4">Evidence-backed visual regression audits.</text>
    <rect x="4" y="244" width="74" height="5" rx="2.5" fill="#6ee7ff"/>
    <rect x="88" y="244" width="34" height="5" rx="2.5" fill="#a273ff"/>
    <rect x="132" y="244" width="14" height="5" rx="2.5" fill="#f5d76e"/>
  </g>

  <g transform="translate(638 94)" filter="url(#shadow)">
    <rect width="536" height="394" rx="18" fill="#0c0f1d" stroke="#8d9acb" stroke-opacity=".5"/>
    <rect x="1" y="1" width="534" height="42" rx="17" fill="#20243a"/>
    <circle cx="25" cy="22" r="6" fill="#ff6d83"/>
    <circle cx="45" cy="22" r="6" fill="#f5d76e"/>
    <circle cx="65" cy="22" r="6" fill="#64e8ff"/>
    <rect x="102" y="14" width="300" height="16" rx="8" fill="#0f1221" stroke="#707ba6" stroke-opacity=".4"/>
    <text x="116" y="26" fill="#8993b8" font-family="monospace" font-size="9">oh-i-see / responsive sweep</text>

    <rect x="32" y="76" width="472" height="268" rx="10" fill="#14182a"/>
    <text x="54" y="103" fill="#9da8d1" font-family="monospace" font-size="10">VIEWPORT MATRIX</text>

    <g transform="translate(54 124)">
      <rect width="246" height="164" rx="7" fill="#0b0e1a" stroke="#6ee7ff" stroke-width="2"/>
      <rect x="14" y="14" width="218" height="22" rx="4" fill="#252c49"/>
      <rect x="14" y="52" width="142" height="8" rx="4" fill="#e8ebff"/>
      <rect x="14" y="70" width="180" height="6" rx="3" fill="#6f789c"/>
      <rect x="14" y="96" width="218" height="38" rx="5" fill="#1b2140" stroke="#303855"/>
      <text x="14" y="153" fill="#6ee7ff" font-family="monospace" font-size="10">1440 × 900  /  PASS</text>
    </g>

    <g transform="translate(322 124)">
      <rect width="86" height="164" rx="8" fill="#0b0e1a" stroke="#a273ff" stroke-width="2"/>
      <rect x="10" y="14" width="66" height="18" rx="4" fill="#252c49"/>
      <rect x="10" y="48" width="66" height="6" rx="3" fill="#e8ebff"/>
      <rect x="10" y="62" width="50" height="5" rx="2.5" fill="#6f789c"/>
      <rect x="10" y="82" width="66" height="45" rx="5" fill="#1b2140" stroke="#303855"/>
      <text x="10" y="148" fill="#a273ff" font-family="monospace" font-size="9">768  PASS</text>
    </g>

    <g transform="translate(422 124)">
      <rect width="50" height="164" rx="8" fill="#0b0e1a" stroke="#f5d76e" stroke-width="2"/>
      <rect x="7" y="14" width="36" height="18" rx="3" fill="#252c49"/>
      <rect x="7" y="48" width="36" height="5" rx="2.5" fill="#e8ebff"/>
      <rect x="7" y="62" width="27" height="4" rx="2" fill="#6f789c"/>
      <rect x="7" y="80" width="36" height="50" rx="4" fill="#1b2140" stroke="#303855"/>
      <text x="7" y="148" fill="#f5d76e" font-family="monospace" font-size="8">390</text>
    </g>
  </g>

  <g transform="translate(638 526)">
    <circle cx="0" cy="0" r="5" fill="#6ee7ff"/>
    <text x="17" y="5" fill="#9da8d1" font-family="monospace" font-size="13">DESKTOP  •  TABLET  •  MOBILE</text>
  </g>

  <text x="1194" y="606" text-anchor="end" fill="#7f8ab1" font-family="monospace" font-size="12" letter-spacing="2">OH-I-SEE / 2026</text>
</svg>
