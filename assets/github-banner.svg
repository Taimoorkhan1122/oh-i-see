<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Oh I See — evidence-backed visual regression audits</title>
  <desc id="desc">A dark visual forensics banner with a browser window comparing desktop, tablet, and mobile responsive viewports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111321"/>
      <stop offset="0.58" stop-color="#17142b"/>
      <stop offset="1" stop-color="#081d29"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="24%" r="68%">
      <stop offset="0" stop-color="#b8f3e2" stop-opacity=".3"/>
      <stop offset=".4" stop-color="#d8c4ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b7c7ff" stroke-opacity=".075"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <circle cx="1060" cy="116" r="115" fill="#d8c4ff" opacity=".14" filter="url(#soft)"/>
  <circle cx="1110" cy="500" r="135" fill="#b8f3e2" opacity=".1" filter="url(#soft)"/>

  <g transform="translate(84 100)">
    <text x="0" y="26" fill="#b8f3e2" font-family="monospace" font-size="18" font-weight="700" letter-spacing="4">VISUAL QA / 01</text>
    <text x="0" y="146" fill="#f5f7ff" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" letter-spacing="-5">Oh I See</text>
    <text x="5" y="196" fill="#bfc7e8" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing=".4">Evidence-backed visual regression audits.</text>
    <rect x="4" y="244" width="74" height="5" rx="2.5" fill="#b8f3e2"/>
    <rect x="88" y="244" width="34" height="5" rx="2.5" fill="#d8c4ff"/>
    <rect x="132" y="244" width="14" height="5" rx="2.5" fill="#ffd1ba"/>
  </g>

  <g transform="translate(638 94)" filter="url(#shadow)">
    <rect width="536" height="394" rx="18" fill="#f7f8fc" stroke="#d7dbea" stroke-width="2"/>
    <rect x="1" y="1" width="534" height="42" rx="17" fill="#e8eaf2"/>
    <circle cx="25" cy="22" r="6" fill="#ff8f9f"/>
    <circle cx="45" cy="22" r="6" fill="#f2c96d"/>
    <circle cx="65" cy="22" r="6" fill="#92d9c5"/>
    <rect x="102" y="14" width="300" height="16" rx="8" fill="#fff" stroke="#c8ccdc"/>
    <text x="116" y="26" fill="#7a8098" font-family="monospace" font-size="9">oh-i-see / responsive sweep</text>

    <rect x="32" y="76" width="472" height="268" rx="10" fill="#fff" stroke="#e1e3ec"/>
    <text x="54" y="103" fill="#66708c" font-family="monospace" font-size="10">VIEWPORT MATRIX</text>

    <g transform="translate(54 124)">
        <rect width="246" height="164" rx="7" fill="#fbfcff" stroke="#9bdcca" stroke-width="2"/>
        <rect x="14" y="14" width="218" height="22" rx="4" fill="#e9edf7"/>
        <rect x="14" y="52" width="142" height="8" rx="4" fill="#3d4662"/>
        <rect x="14" y="70" width="180" height="6" rx="3" fill="#8991a8"/>
        <rect x="14" y="96" width="218" height="38" rx="5" fill="#eef1fb" stroke="#d8ddec"/>
      <text x="14" y="153" fill="#b8f3e2" font-family="monospace" font-size="10">1440 × 900  /  PASS</text>
    </g>

    <g transform="translate(322 124)">
      <rect width="86" height="164" rx="8" fill="#fbfcff" stroke="#c8b2f2" stroke-width="2"/>
      <rect x="10" y="14" width="66" height="18" rx="4" fill="#e9edf7"/>
      <rect x="10" y="48" width="66" height="6" rx="3" fill="#3d4662"/>
      <rect x="10" y="62" width="50" height="5" rx="2.5" fill="#8991a8"/>
      <rect x="10" y="82" width="66" height="45" rx="5" fill="#eef1fb" stroke="#d8ddec"/>
      <text x="10" y="148" fill="#d8c4ff" font-family="monospace" font-size="9">768  PASS</text>
    </g>

    <g transform="translate(422 124)">
      <rect width="50" height="164" rx="8" fill="#fbfcff" stroke="#f2bda4" stroke-width="2"/>
      <rect x="7" y="14" width="36" height="18" rx="3" fill="#e9edf7"/>
      <rect x="7" y="48" width="36" height="5" rx="2.5" fill="#3d4662"/>
      <rect x="7" y="62" width="27" height="4" rx="2" fill="#8991a8"/>
      <rect x="7" y="80" width="36" height="50" rx="4" fill="#eef1fb" stroke="#d8ddec"/>
      <text x="7" y="148" fill="#ffd1ba" font-family="monospace" font-size="8">390</text>
    </g>
  </g>

  <g transform="translate(638 526)">
    <circle cx="0" cy="0" r="5" fill="#b8f3e2"/>
    <text x="17" y="5" fill="#9da8d1" font-family="monospace" font-size="13">DESKTOP  •  TABLET  •  MOBILE</text>
  </g>

  <text x="1194" y="606" text-anchor="end" fill="#7f8ab1" font-family="monospace" font-size="12" letter-spacing="2">OH-I-SEE / 2026</text>
</svg>
